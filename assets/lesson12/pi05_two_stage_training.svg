<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16826c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .stage { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#f7f4ed"/>
  <text x="50" y="52" class="title">π₀.₅ 两阶段训练：continuous action expert 何时加入？</text>
  <text x="50" y="82" class="body">颜色表示参数来源：蓝色为 VLM 初始化，绿色为阶段 1 已适配参数，紫色为阶段 2 新加入并随机初始化的 action expert。</text>

  <!-- Stage 0 -->
  <rect x="50" y="125" width="250" height="525" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="165" text-anchor="middle" class="stage">起点：VLM</text>
  <rect x="85" y="215" width="180" height="80" rx="12" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="175" y="248" text-anchor="middle" class="label">Vision encoder</text>
  <text x="175" y="274" text-anchor="middle" class="small">预训练参数</text>
  <rect x="85" y="335" width="180" height="150" rx="12" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="175" y="373" text-anchor="middle" class="label">VLM backbone</text>
  <text x="175" y="404" text-anchor="middle" class="body">Transformer layer × L</text>
  <text x="175" y="433" text-anchor="middle" class="small">图像 / 文本 token</text>
  <text x="175" y="459" text-anchor="middle" class="small">next-token prediction</text>
  <path d="M175 295 L175 335" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="85" y="525" width="180" height="70" rx="12" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="175" y="556" text-anchor="middle" class="label">LM token head</text>
  <text x="175" y="580" text-anchor="middle" class="small">text logits</text>
  <path d="M175 485 L175 525" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="175" y="625" text-anchor="middle" class="body">此时没有连续 flow 路径</text>

  <path d="M300 390 L340 390" stroke="#16826c" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- Stage 1 -->
  <rect x="340" y="125" width="440" height="525" rx="18" fill="#ecfdf5" stroke="#16826c" stroke-width="2"/>
  <text x="560" y="165" text-anchor="middle" class="stage">阶段 1：heterogeneous pre-training</text>

  <rect x="375" y="200" width="115" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="432" y="229" text-anchor="middle" class="label">Web / VLM</text>
  <text x="432" y="252" text-anchor="middle" class="small">text token</text>
  <rect x="505" y="200" width="115" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="562" y="229" text-anchor="middle" class="label">Semantic</text>
  <text x="562" y="252" text-anchor="middle" class="small">subtask token</text>
  <rect x="635" y="200" width="110" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="690" y="229" text-anchor="middle" class="label">Robot</text>
  <text x="690" y="252" text-anchor="middle" class="small">FAST token</text>

  <path d="M432 270 L500 320" stroke="#16826c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M562 270 L562 320" stroke="#16826c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M690 270 L625 320" stroke="#16826c" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="405" y="320" width="310" height="145" rx="14" fill="#bbf7d0" stroke="#16826c" stroke-width="2"/>
  <text x="560" y="358" text-anchor="middle" class="label">同一个 VLM backbone</text>
  <text x="560" y="391" text-anchor="middle" class="body">不同任务统一成离散 token 序列</text>
  <text x="560" y="421" text-anchor="middle" class="body">训练 next-token cross entropy</text>
  <text x="560" y="449" text-anchor="middle" class="small">VLM 参数在 robot / semantic / web mixture 上更新</text>

  <rect x="405" y="510" width="310" height="80" rx="12" fill="#bbf7d0" stroke="#16826c"/>
  <text x="560" y="543" text-anchor="middle" class="label">LM / token head</text>
  <text x="560" y="570" text-anchor="middle" class="small">text、location、subtask、FAST action logits</text>
  <path d="M560 465 L560 510" stroke="#16826c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="560" y="622" text-anchor="middle" class="body">continuous action expert 尚未加入，也没有 flow loss</text>

  <path d="M780 390 L820 390" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>

  <!-- Stage 2 -->
  <rect x="820" y="125" width="530" height="525" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1085" y="165" text-anchor="middle" class="stage">阶段 2：mobile-manipulation post-training</text>
  <text x="1085" y="194" text-anchor="middle" class="body">保留阶段 1 的 backbone；加入完整 continuous action expert 路径</text>

  <text x="955" y="235" text-anchor="middle" class="label">阶段 1 参数</text>
  <text x="1215" y="235" text-anchor="middle" class="label">随机初始化参数</text>

  <rect x="860" y="255" width="190" height="85" rx="12" fill="#bbf7d0" stroke="#16826c"/>
  <text x="955" y="289" text-anchor="middle" class="label">Backbone layer 1</text>
  <text x="955" y="316" text-anchor="middle" class="small">VLM token path</text>
  <rect x="1120" y="255" width="190" height="85" rx="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1215" y="289" text-anchor="middle" class="label">Action expert 1</text>
  <text x="1215" y="316" text-anchor="middle" class="small">state / noisy action path</text>
  <path d="M1050 298 L1120 298" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <text x="1085" y="372" text-anchor="middle" class="stage">⋮</text>

  <rect x="860" y="395" width="190" height="85" rx="12" fill="#bbf7d0" stroke="#16826c"/>
  <text x="955" y="429" text-anchor="middle" class="label">Backbone layer L</text>
  <text x="955" y="456" text-anchor="middle" class="small">共享 attention 中的 prefix</text>
  <rect x="1120" y="395" width="190" height="85" rx="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1215" y="429" text-anchor="middle" class="label">Action expert L</text>
  <text x="1215" y="456" text-anchor="middle" class="small">每层都有 expert 参数</text>
  <path d="M1050 438 L1120 438" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <rect x="860" y="525" width="190" height="75" rx="12" fill="#bbf7d0" stroke="#16826c"/>
  <text x="955" y="556" text-anchor="middle" class="label">Next-token loss</text>
  <text x="955" y="581" text-anchor="middle" class="small">text + FAST action token</text>
  <rect x="1120" y="525" width="190" height="75" rx="12" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="1215" y="556" text-anchor="middle" class="label">Flow matching loss</text>
  <text x="1215" y="581" text-anchor="middle" class="small">学习 continuous chunk</text>
  <path d="M955 480 L955 525" stroke="#16826c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M1215 480 L1215 525" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="1085" y="628" text-anchor="middle" class="body">原始 π₀.₅ 在 post-training 开始时初始化 action expert</text>

  <!-- Inference -->
  <path d="M1085 650 L1085 690" stroke="#374151" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="260" y="700" width="880" height="145" rx="18" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="700" y="735" text-anchor="middle" class="stage">推理时：同一个模型，两次不同角色的调用</text>
  <rect x="315" y="765" width="270" height="55" rx="10" fill="#bbf7d0" stroke="#16826c"/>
  <text x="450" y="798" text-anchor="middle" class="label">① 高层：预测 semantic subtask</text>
  <path d="M585 792 L650 792" stroke="#374151" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="650" y="765" width="435" height="55" rx="10" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="868" y="798" text-anchor="middle" class="label">② 低层：subtask 条件化 flow expert → action chunk</text>

  <rect x="260" y="866" width="18" height="18" rx="3" fill="#bfdbfe"/><text x="288" y="880" class="small">VLM 初始化</text>
  <rect x="440" y="866" width="18" height="18" rx="3" fill="#bbf7d0"/><text x="468" y="880" class="small">阶段 1 已训练</text>
  <rect x="640" y="866" width="18" height="18" rx="3" fill="#ddd6fe"/><text x="668" y="880" class="small">阶段 2 随机初始化并训练</text>
  <text x="950" y="880" class="small">后续 KI：在 expert 读取 backbone 的梯度路径加入 stop-gradient</text>
</svg>
