[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-from-scratch"
version = "0.1.0"
description = "A small, readable π-style vision-language-action training framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
lerobot = ["lerobot>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
pi-contract-demo = "pi_from_scratch.lesson01:main"
pi-train = "pi_from_scratch.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
