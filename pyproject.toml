[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-from-scratch"
version = "0.1.0"
description = "A small, readable π-style vision-language-action training framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
lerobot = ["lerobot[dataset]>=0.6,<0.7"]
sim = ["gym-pusht==0.1.6"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
pi-contract-demo = "pi_from_scratch.cli.lesson01:main"
pi-data-window-demo = "pi_from_scratch.cli.lesson02:main"
pi-action-transform-demo = "pi_from_scratch.cli.lesson03:main"
pi-chunk-execution-demo = "pi_from_scratch.cli.lesson04:main"
pi-flow-matching-demo = "pi_from_scratch.cli.lesson05:main"
pi-prefix-suffix-demo = "pi_from_scratch.cli.lesson06:main"
pi-training-demo = "pi_from_scratch.cli.lesson07:main"
pi-sampling-demo = "pi_from_scratch.cli.lesson08:main"
pi-closed-loop-demo = "pi_from_scratch.cli.lesson09:main"
pi-visualize-chunk = "pi_from_scratch.cli.visualize_chunk:main"
pi-train = "pi_from_scratch.cli.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
